<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>LegaNews — Brasil & Mundo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background:#0f0f0f;
  color:#fff;
  font-family:Arial,sans-serif;
  margin:0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
header {
  padding:20px;
  background:#111;
  border-bottom:1px solid #2a2a2a;
}
.card-wrapper {
  position:relative;
  max-width:780px;
  width:100%;
  margin-top:40px;
}
.card-logo {
  position:absolute;
  top:0;
  left:50%;
  transform:translate(-50%,-50%);
  width:170px;
  height:auto;
  z-index:2;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
}
.live {
  color:#ff3b3b;
  font-weight:bold;
  margin-top:5px;
}
main {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  gap:14px;
}
.card {
  position:relative;
  max-width:780px;
  width:100%;
  display:flex;
  gap:16px;
  border:1px solid #2a2a2a;
  border-radius:8px;
  padding:18px;
  background:#1c1c1c;
}
.card img {
  width:220px;
  height:160px;
  object-fit:cover;
  object-position:center top;
  border-radius:6px;
  background:#000;
  flex-shrink:0;
}
.badge {
  position:absolute;
  top:10px;
  left:10px;
  padding:4px 10px;
  font-size:11px;
  font-weight:bold;
  border-radius:12px;
  text-transform:uppercase;
}
.badge.br { background:#1db954; color:#000; }
.badge.int { background:#3b82f6; color:#fff; }

.content h2 {
  margin:0 0 10px 0;
  font-size:20px;
  line-height:1.3;
}
.content p {
  margin:0 0 10px 0;
  color:#e0e0e0;
  font-size:14px;
  line-height:1.4;
}
.meta {
  font-size:12px;
  color:#b0b0b0;
}
.controls {
  display:flex;
}
button {
  background:#ff3b3b;
  border:none;
  color:#fff;
  padding:10px 18px;
  font-size:14px;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
}
button:hover { background:#ff5555; }

a { color:#fff; text-decoration:none; }
a:hover { text-decoration:underline; }

@media (max-width:600px) {
  .card { flex-direction:column; }
  .card img { width:100%; height:220px; }
}
</style>
</head>

<body>

<header>
  <div class="live">🔴 AO VIVO — Brasil em destaque • Mundo essencial</div>
</header>

<main>
  <div class="card-wrapper">
    <img src="logo-leganews.png" alt="LegaNews" class="card-logo">
    <div id="card">Carregando notícias…</div>
  </div>
  <div class="controls">
    <button id="nextBtn">▶ Próxima notícia</button>
  </div>
</main>

<script>
/* ================= FONTES ================= */
const fontesBR = [
  { url:"https://api.rss2json.com/v1/api.json?rss_url=https://portalpopline.com.br/feed/", tipo:"br" },
  { url:"https://api.rss2json.com/v1/api.json?rss_url=https://rollingstone.uol.com.br/feed/", tipo:"br" },
  { url:"https://api.rss2json.com/v1/api.json?rss_url=https://www.vagalume.com.br/news/index.xml", tipo:"br" }
];

const fontesINT = [
  { url:"https://api.rss2json.com/v1/api.json?rss_url=https://pitchfork.com/rss/news/", tipo:"int" },
  { url:"https://api.rss2json.com/v1/api.json?rss_url=https://www.rollingstone.com/music/music-news/feed/", tipo:"int" },
  { url:"https://api.rss2json.com/v1/api.json?rss_url=https://www.nme.com/news/music/feed", tipo:"int" }
];

const imagemEditorial = "https://picsum.photos/600/400?grayscale";

const blacklist = [
  "Festival","Grammy","Billboard","Spotify","Apple",
  "Turnê","Mercado","Gravadora","Indústria","Premiação"
];

let noticias = [];
let indice = 0;
let timer = null;

const container = document.getElementById("card");
const nextBtn = document.getElementById("nextBtn");

/* ================= TEXTO ================= */
function limparTexto(html) {
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.textContent.replace(/\s+/g," ").trim();
}
function ehPortugues(t) {
  return /[ãõáéíóúç]/i.test(t) || /\b(de|para|com|que|uma|por)\b/i.test(t);
}
async function traduzir(t) {
  if (!t || ehPortugues(t)) return t;
  try {
    const r = await fetch(
      "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pt-BR&dt=t&q=" +
      encodeURIComponent(t)
    );
    const d = await r.json();
    return d[0].map(x=>x[0]).join("");
  } catch { return t; }
}
function resumir(t) {
  const f = t.split(/(?<=[.!?])\s+/);
  let r = f.slice(0,3).join(" ");
  if (r.length > 240) r = r.slice(0,240)+"…";
  return r;
}

/* ================= IMAGENS ================= */
function imagemRssValida(url) {
  return /wp-content|uploads|images|media/i.test(url);
}

function extrairCandidatos(titulo) {
  const r = /([A-ZÀ-Ÿ][a-zà-ÿ]+(?:\s[A-ZÀ-Ÿ][a-zà-ÿ]+){0,3})/g;
  return (titulo.match(r) || []).filter(
    n => !blacklist.some(b => n.includes(b))
  );
}

async function imagemWikipedia(nome) {
  try {
    const r = await fetch(
      "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=600&titles=" +
      encodeURIComponent(nome)
    );
    const d = await r.json();
    const p = Object.values(d.query.pages)[0];
    return p?.thumbnail?.source || null;
  } catch { return null; }
}

async function escolherImagem(item) {
  if (item.thumbnail && imagemRssValida(item.thumbnail)) {
    return item.thumbnail;
  }
  for (const nome of extrairCandidatos(item.title)) {
    const img = await imagemWikipedia(nome);
    if (img) return img;
  }
  return imagemEditorial;
}

/* ================= FEED ================= */
async function carregarGrupo(fontes) {
  let l = [];
  for (const f of fontes) {
    try {
      const r = await fetch(f.url);
      const d = await r.json();
      d.items.forEach(i => { i._tipo = f.tipo; l.push(i); });
    } catch {}
  }
  return l.sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate));
}

async function carregarNoticias() {
  const br = await carregarGrupo(fontesBR);
  const intl = await carregarGrupo(fontesINT);

  noticias = [];
  let i=0, j=0;
  while (i<br.length || j<intl.length) {
    for (let k=0;k<7 && i<br.length;k++) noticias.push(br[i++]);
    for (let k=0;k<3 && j<intl.length;k++) noticias.push(intl[j++]);
  }
  indice = 0;
  mostrarNoticia();
  iniciarTimer();
}

async function mostrarNoticia() {
  if (!noticias.length) return;

  const n = noticias[indice];
  const tituloPT = await traduzir(limparTexto(n.title));
  const resumoPT = resumir(await traduzir(limparTexto(n.description)));
  const img = await escolherImagem(n);

  const badge = n._tipo==="br"
    ? `<div class="badge br">Fonte: 🇧🇷 Brasil</div>`
    : `<div class="badge int">Fonte: 🌍 Internacional</div>`;

  container.innerHTML = `
    <div class="card">
      ${badge}
      <img src="${img}" onerror="this.src='${imagemEditorial}'">
      <div class="content">
        <h2><a href="${n.link}" target="_blank">${tituloPT}</a></h2>
        <p>${resumoPT}</p>
        <div class="meta">${new Date(n.pubDate).toLocaleString("pt-BR")}</div>
      </div>
    </div>
  `;

  indice = (indice + 1) % noticias.length;
}

function iniciarTimer() {
  clearInterval(timer);
  timer = setInterval(mostrarNoticia, 60000);
}

nextBtn.onclick = () => {
  mostrarNoticia();
  iniciarTimer();
};

carregarNoticias();
setInterval(carregarNoticias, 600000);
</script>

</body>
</html>
